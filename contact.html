<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Contact Us | Wanderlust Adventures</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">Wanderlust <span>Adventures</span></div>
        <button class="menu-toggle" id="menuToggle">☰</button>
        <nav id="navMenu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="packages.html">Packages</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="booking.html">Booking</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Get In Touch</h1>
        <p style="margin-bottom: 40px;">Have questions before you finalize your route? Drop us a general query message.</p>
        
        <form class="contact-form" id="generalContactForm">
            <div class="form-group">
                <label for="c_name">Full Name *</label>
                <input type="text" id="c_name" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="c_email">Email Address *</label>
                <input type="email" id="c_email" required placeholder="yourname@domain.com">
            </div>
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="What is this regarding?">
            </div>
            <div class="form-group">
                <label for="message">Your Message *</label>
                <textarea id="message" rows="5" required placeholder="Type your message details here..."></textarea>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Wanderlust Adventures. Built for MANTRA 2026.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
